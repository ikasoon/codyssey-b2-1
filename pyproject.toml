[project]
name = "budget-app"
version = "0.1.0"
description = "CSV based command-line allowance ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
budget-app = "budget_app.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["budget_app"]
